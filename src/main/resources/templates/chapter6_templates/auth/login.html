<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理フォーム - ログイン</title>
    <link rel="stylesheet" th:href="@{/css/chapter6.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/product-list}">商品管理フォーム</a>
</header>

<main class="container narrow">
    <section class="page-head">
        <h1>ログイン</h1>
        <p>ユーザー名とパスワードを入力してください。</p>
    </section>

    <form class="form" th:action="@{/login}" method="post">
        <p class="alert" th:if="${param.error}">ユーザー名またはパスワードが違います。</p>
        <p class="notice" th:if="${param.logout}">ログアウトしました。</p>

        <label>
            ユーザー名
            <input type="text" name="username" autocomplete="username" placeholder="ユーザー名を入力してください">
        </label>

        <label>
            パスワード
            <input type="password" name="password" autocomplete="current-password" placeholder="パスワードを入力してください">
        </label>

        <button type="submit">ログイン</button>
    </form>
</main>
</body>
</html>
