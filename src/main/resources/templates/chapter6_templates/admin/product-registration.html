<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品登録</title>
    <link rel="stylesheet" th:href="@{/css/chapter6.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/product-list}">商品管理フォーム</a>
    <nav class="nav">
        <a th:href="@{/product-list}">商品一覧</a>
        <form th:action="@{/logout}" method="post">
            <span class="login-status">
                <span th:text="${loginUsername}">admin</span>でログイン中
            </span>
            <button type="submit">ログアウト</button>
        </form>
    </nav>
</header>

<main class="container narrow">
    <section class="page-head">
        <h1>商品登録</h1>
        <p>商品を登録することができるページです。</p>
        <p>※「公開する」のチェックを有効にすると公開状態に設定できます。</p>
    </section>

    <form class="form" th:action="@{/product-registration}" th:object="${product}" method="post">

        <label>
            商品名
            <input type="text" th:field="*{name}">
        </label>
        <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">エラー</p>

        <label>
            値段
            <input type="number" th:field="*{price}">
        </label>
        <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">エラー</p>

        <label>
            在庫数
            <input type="number" th:field="*{stock}">
        </label>
        <p class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">エラー</p>

        <label class="check">
            <input type="checkbox" th:field="*{published}">
            公開する
        </label>

        <button type="submit">登録する</button>
    </form>
</main>
</body>
</html>
