<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理</title>
    <link rel="stylesheet" th:href="@{/css/chapter6.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/product-list}">商品管理フォーム</a>
    <nav class="nav">
        <a th:href="@{/product-list}">商品一覧</a>
        <a th:href="@{/product-management}">商品管理</a>
        <form th:action="@{/logout}" method="post">
            <span class="login-status">
                <span th:text="${loginUsername}">admin</span>でログイン中
            </span>
            <button type="submit">ログアウト</button>
        </form>
    </nav>
</header>

<main class="container">
    <section class="page-head page-head-row">
        <div>
            <h1>商品管理</h1>
            <p>商品情報を管理するページです。公開 / 非公開を切り替えることができます。</p>
            <p>※公開状態にしている商品のみが商品一覧画面に表示されます。</p>
        </div>
        <a class="btn" th:href="@{/product-registration}">商品を登録する</a>
    </section>

    <section class="table-card">
        <table class="table">
            <thead>
            <tr>
                <th>商品ID</th>
                <th>商品名</th>
                <th>値段</th>
                <th>在庫数</th>
                <th>公開 / 非公開</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">商品ID</td>
                <td th:text="${product.name}">商品名</td>
                <td>¥<span th:text="${product.price}">値段</span></td>
                <td th:text="${product.stock}">在庫数</td>
                <td th:text="${product.published} ? '公開' : '非公開'">公開</td>
                <td class="actions">
                    <form th:if="${product.published}"
                          th:action="@{/product-management/{id}/hide(id=${product.id})}" method="post">
                        <button type="submit">非公開にする</button>
                    </form>
                    <form th:unless="${product.published}"
                          th:action="@{/product-management/{id}/publish(id=${product.id})}" method="post">
                        <button type="submit">公開する</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
